name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run automated tests
        run: npm test

      - name: Upload Home UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block-party-home-ui-preview
          path: artifacts/screenshots/home-hub.png
          if-no-files-found: warn
          retention-days: 7

      - name: Typecheck and build web app
        run: |
          npm run typecheck
          npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        if: github.event_name == 'workflow_dispatch'
        working-directory: android
        run: bash ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        if: github.event_name == 'workflow_dispatch'
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: block-party-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
